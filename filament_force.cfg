# filament_force example
#
# Copy this file into printer_data/config and add to printer.cfg:
#   [include filament_force.cfg]
#
# Needs [load_cell_probe] or [load_cell].
#
# Cold extrusion calibration is optional, not a first-use requirement.
# Establish safe device-specific limits before supervised printing.
#
# Toolchanger: this extra does not patch your macros. Call FILAMENT_FORCE_SUPPRESS_BEGIN
# before park/pickup, FILAMENT_FORCE_SUPPRESS_END TOOL={t} after a successful pickup,
# FILAMENT_FORCE_SUPPRESS_END (no TOOL) after a park that leaves the head empty.
# INDX example: README.
#
# If your RESUME wrapper does extra work, add:
#   {% if printer.filament_force.pending_recheck|int == 1 %}
#       FILAMENT_FORCE_RESUME
#   {% endif %}

[filament_force]
sensor: load_cell_probe

# Persist healthy force-model windows across Klipper restarts.
# Change model_profile whenever material, nozzle, hotend temperature,
# load-cell mounting/calibration, or other force-affecting setup changes.
model_persistence: True
model_file: ~/printer_data/config/filament_force_model.json
model_profile: default
model_save_interval: 60.0

# Free-air diagnosis after either JAM source, opt-in.
# No automatic movement without the preparation macro's clearance acknowledgment.
# Set a calibrated safe limit before enabling. Learned printing bands are
# reused; optional min/max are a manual fallback (not valid for auto-resume).
#diagnostic_enabled: False
#diagnostic_auto: False
# Fixed configured speed by default; True matches triggering speed up to diagnostic_speed.
#diagnostic_match_speed: False
#diagnostic_force_limit: 0
#diagnostic_force_min: 0
#diagnostic_force_max: 0
# E-axis filament feed, mm/s (0.5–6.0), qualify for your hardware.
#diagnostic_speed: 3.0
# Minimum pulse length; actual length >= speed * 0.5s, max 3 mm.
#diagnostic_pulse_mm: 0.5
#diagnostic_pulses: 3
#diagnostic_baseline_span: 30.0
#diagnostic_max_sample_gap_s: 0.05

# Protection reliability (qualify against actual sensor delivery intervals).
#sensor_timeout_s: 2.0
#baseline_max_span_g: 100.0
#baseline_timeout_s: 3.0

# Experimental automatic recovery, disabled until hardware qualification.
# A tested resume_gcode must invoke the underlying PAUSE_STATE resume path.
#auto_resume_enabled: False
#auto_resume_max_attempts: 2
# Total automatic attempts per job, including first-layer recovery.
#auto_resume_job_max_attempts: 10
#auto_resume_reset_s: 60.0

# Native Klippy events + Moonraker status journal (read-only).
#event_enabled: True
#event_window_s: 30.0
#event_max_points: 512
#auto_resume_verify_windows: 3
#recovery_verify_timeout: 60.0

# First-layer gap correction after a healthy matched free-air test.
# Requires explicit CURRENT_LAYER=1 and compatible Kalico PAUSE_STATE.
#first_layer_z_enabled: False
#first_layer_z_step: 0.02
#first_layer_z_max_adjustments: 3
#first_layer_z_max_total: 0.06
#first_layer_z_cooldown_s: 10.0
#first_layer_z_max_height: 0.60
#first_layer_z_max_force: 2000.0
#first_layer_verify_windows: 2
#first_layer_min_improvement: 0.15
# Learned-band jam vs per-tool history. Off leaves oh_shit_force on.
#sigma_jam: False
# Statistical confirmation uses valid extrusion windows, not individual peaks.
# Evidence expires after a gap between eligible windows; hard force is separate.
#confirm_windows: 3
#confirm_max_gap_s: 30.0
#detection_length: 7.0
#jam_dwell_s: 0.15
# Do not set oh_shit_force here. FILAMENT_FORCE_CAL_OH_SHIT writes it
# via SAVE_CONFIG into printer.cfg, which cannot override an include.

# Optional. params: TOOL, REASON, MSG, TARGET.
#runout_gcode:
#    RESPOND MSG="filament_force runout T{params.TOOL}"
#jam_gcode:
#    RESPOND MSG="filament_force jam T{params.TOOL}"
#recover_gcode:
#resume_gcode:

# Strategy 1: optional preparation macro; the core already paused.
# Add machine-specific, validated park / clearance / waste collection.
# Only after verified safe clearance issue:
#    M400
#    FILAMENT_FORCE_DIAG_READY CLEARANCE=1
# Default does NOT grant clearance or move XYZ.
#[gcode_macro FILAMENT_FORCE_JAM_ACTION]
#gcode:
#    RESPOND MSG="Preparing diagnosis: {params.SOURCE}"

# Strategy 2: optional confirmed high-resistance handling. Stay paused.
#[gcode_macro FILAMENT_FORCE_CONFIRMED_JAM_ACTION]
#gcode:
#    RESPOND MSG="High free-air resistance; inspect extruder"

[gcode_macro FILAMENT_FORCE_SUPPRESS_BEGIN]
description: Call before park or pickup
gcode:
    FILAMENT_FORCE_SUPPRESS ENABLE=1

[gcode_macro FILAMENT_FORCE_SUPPRESS_END]
description: Call after pickup (TOOL=<n>) or an empty park
gcode:
    {% if 'TOOL' in params %}
        FILAMENT_FORCE_SET_TOOL TOOL={params.TOOL|int}
    {% endif %}
    FILAMENT_FORCE_SUPPRESS ENABLE=0
