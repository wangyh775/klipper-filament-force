<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="09  Recovery state machine"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="600" fill="#fff"/><g font-family="Times New Roman, SimSun, Noto Serif CJK SC, serif"><text x="32" y="36" font-size="23" font-weight="bold" fill="#182435">09  Recovery state machine</text><path d="M32 49H928" stroke="#cad3df"/><rect x="330" y="65" width="300" height="44" rx="5" stroke="#16a34a" fill="#16a34a" fill-opacity=".065"/><text x="480" y="93" text-anchor="middle" font-size="17" fill="#182435">MONITORING</text><path d="M480 109V130" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="130" width="300" height="44" rx="5" stroke="#2563eb" fill="#2563eb" fill-opacity=".065"/><text x="480" y="158" text-anchor="middle" font-size="17" fill="#182435">PREPARING</text><path d="M480 174V195" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="195" width="300" height="44" rx="5" stroke="#2563eb" fill="#2563eb" fill-opacity=".065"/><text x="480" y="223" text-anchor="middle" font-size="17" fill="#182435">WAITING_DIAGNOSIS</text><path d="M480 239V260" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="260" width="300" height="44" rx="5" stroke="#2563eb" fill="#2563eb" fill-opacity=".065"/><text x="480" y="288" text-anchor="middle" font-size="17" fill="#182435">DIAGNOSING</text><path d="M330 282H165V330" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><path d="M480 304V330" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><path d="M630 282H795V330" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><rect x="25" y="330" width="280" height="54" rx="5" stroke="#dc2626" fill="#dc2626" fill-opacity=".065"/><text x="165" y="352" text-anchor="middle" font-size="17" fill="#182435">CONFIRMED_JAM</text><text x="165" y="374" text-anchor="middle" font-size="14" fill="#334155">Strategy 2; paused</text><rect x="340" y="330" width="280" height="54" rx="5" stroke="#2563eb" fill="#2563eb" fill-opacity=".065"/><text x="480" y="352" text-anchor="middle" font-size="17" fill="#182435">WAITING_RECOVERY</text><text x="480" y="374" text-anchor="middle" font-size="14" fill="#334155">All gates required</text><rect x="655" y="330" width="280" height="54" rx="5" stroke="#dc2626" fill="#dc2626" fill-opacity=".065"/><text x="795" y="352" text-anchor="middle" font-size="17" fill="#182435">FAILED</text><text x="795" y="374" text-anchor="middle" font-size="14" fill="#334155">May not emit failure event</text><path d="M480 384V407" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><rect x="340" y="407" width="280" height="44" rx="5" stroke="#2563eb" fill="#2563eb" fill-opacity=".065"/><text x="480" y="435" text-anchor="middle" font-size="17" fill="#182435">RESUMING</text><path d="M480 451V474" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><rect x="340" y="474" width="280" height="44" rx="5" stroke="#2563eb" fill="#2563eb" fill-opacity=".065"/><text x="480" y="502" text-anchor="middle" font-size="17" fill="#182435">VERIFYING</text><path d="M340 496H15V87H330" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><path d="M620 496H945V357H935" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><path d="M340 485H310V152H330" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><text x="152" y="488" text-anchor="middle" font-size="14" fill="#15803d">Healthy → monitor</text><text x="220" y="148" text-anchor="middle" font-size="14" fill="#d97706">Eligible retry</text><text x="802" y="487" text-anchor="middle" font-size="14" fill="#b91c1c">Bad / timeout</text><text x="480" y="550" text-anchor="middle" font-size="15" fill="#334155">Hard trip during VERIFYING → PREPARING, but no automatic resume</text><text x="480" y="575" text-anchor="middle" font-size="15" fill="#334155">Cancel/new job resets transient state; manual recovery requires inspection</text></g></svg>