<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 535" role="img" aria-label="08  First-layer feedback loop"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="535" fill="#fff"/><g font-family="Times New Roman, SimSun, Noto Serif CJK SC, serif"><text x="32" y="36" font-size="23" font-weight="bold" fill="#182435">08  First-layer feedback loop</text><path d="M32 49H928" stroke="#cad3df"/><rect x="310" y="70" width="340" height="60" rx="5" stroke="#2563eb" fill="#2563eb" fill-opacity=".065"/><text x="480" y="95" text-anchor="middle" font-size="17" fill="#182435">Flow compatible + all gates</text><text x="480" y="117" text-anchor="middle" font-size="14" fill="#334155">Known layer 1</text><path d="M480 130V153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><rect x="310" y="153" width="340" height="60" rx="5" stroke="#2563eb" fill="#2563eb" fill-opacity=".065"/><text x="480" y="178" text-anchor="middle" font-size="17" fill="#182435">Shift PAUSE_STATE +0.02 mm</text><text x="480" y="200" text-anchor="middle" font-size="14" fill="#334155">Check cap and offset</text><path d="M480 213V236" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><rect x="310" y="236" width="340" height="60" rx="5" stroke="#2563eb" fill="#2563eb" fill-opacity=".065"/><text x="480" y="261" text-anchor="middle" font-size="17" fill="#182435">VERIFYING</text><text x="480" y="283" text-anchor="middle" font-size="14" fill="#334155">Freeze reference; 60 s watchdog</text><path d="M480 296V316H165V340" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><path d="M480 296V340" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><path d="M480 316H795V340" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><rect x="22" y="340" width="286" height="68" rx="5" stroke="#16a34a" fill="#16a34a" fill-opacity=".065"/><text x="165" y="369" text-anchor="middle" font-size="17" fill="#182435">2 healthy windows</text><text x="165" y="391" text-anchor="middle" font-size="14" fill="#334155">MONITORING</text><rect x="337" y="340" width="286" height="68" rx="5" stroke="#d97706" fill="#d97706" fill-opacity=".065"/><text x="480" y="369" text-anchor="middle" font-size="17" fill="#182435">3 bad windows (default)</text><text x="480" y="391" text-anchor="middle" font-size="14" fill="#334155">HIGH and improved ≥15%?</text><rect x="652" y="340" width="286" height="68" rx="5" stroke="#dc2626" fill="#dc2626" fill-opacity=".065"/><text x="795" y="369" text-anchor="middle" font-size="17" fill="#182435">Hard trip / timeout</text><text x="795" y="391" text-anchor="middle" font-size="14" fill="#334155">Pause; no auto-recovery</text><path d="M480 408V430H326V450" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><path d="M480 430H635V450" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><rect x="190" y="450" width="272" height="60" rx="5" stroke="#d97706" fill="#d97706" fill-opacity=".065"/><text x="326" y="475" text-anchor="middle" font-size="17" fill="#182435">Yes + budget</text><text x="326" y="497" text-anchor="middle" font-size="14" fill="#334155">Pause and re-diagnose</text><rect x="500" y="450" width="270" height="60" rx="5" stroke="#dc2626" fill="#dc2626" fill-opacity=".065"/><text x="635" y="475" text-anchor="middle" font-size="17" fill="#182435">No / LOW / no budget</text><text x="635" y="497" text-anchor="middle" font-size="14" fill="#334155">Stay paused</text><path d="M190 480H12V100H310" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/><text x="105" y="473" text-anchor="middle" font-size="14" fill="#334155">Retry loop</text></g></svg>